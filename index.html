    if (humanOrder.length > 0) {

    }
    nowPlaying.play();
    nowPlaying.addEventListener("ended", playNextSong);
  }

  function next() {
    nowPlaying.stop();
    playNextSong();

    nowNumber++;

  function search() {
    const search = document.getElementById("search").value.toLowerCase();

      if (words.includes(search) == false) {

      } else {
        document.getElementById(i).style.display = "";
      }
    }
  }
